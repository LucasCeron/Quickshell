# Quickshell config — the current wallpaper remains behind a softened dark overlay.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.45
}

label {
    monitor =
    text = $TIME
    color = rgba(F0CB8Cff)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(F0EEE8ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    outer_color = rgba(E9BF78cc)
    inner_color = rgba(1D2027ee)
    font_color = rgba(F0EEE8ff)
    check_color = rgba(F0CB8Cff)
    fail_color = rgba(FF5F57ff)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Digite sua senha
    fail_text = Senha incorreta
    rounding = 18
    fade_on_empty = false
    position = 0, -50
    halign = center
    valign = center
}
